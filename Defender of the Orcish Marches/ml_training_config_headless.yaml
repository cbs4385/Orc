# Headless ML training config — v7 orc-focused
# Key changes from v6:
#   - Orc: higher beta (0.01) for more exploration of 84-action space
#   - Orc: shorter time_horizon (128) so dense rewards dominate
#   - Orc: lower play_against_latest (0.3) so it practices vs weaker defenders
#   - Shorter episodes via curriculum: start at 5 days, ramp to 10, then 20
#   - Terminal orc loss penalty reduced from -5 to -1 (in code)
#   - Mid-game orc rewards 2-3x larger (in code)

behaviors:
  OrcCommander:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 5120
      learning_rate: 3.0e-4
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      memory:
        memory_size: 256
        sequence_length: 32
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 5000
    keep_checkpoints: 5
    checkpoint_interval: 10000
    self_play:
      save_steps: 10000
      team_change: 10000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.3
      initial_elo: 1200.0

  DefenderCommander:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      memory:
        memory_size: 256
        sequence_length: 32
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 256
    summary_freq: 5000
    keep_checkpoints: 5
    checkpoint_interval: 10000
    self_play:
      save_steps: 10000
      team_change: 5000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

environment_parameters:
  max_day:
    curriculum:
      - name: Lesson0
        completion_criteria:
          measure: reward
          behavior: OrcCommander
          min_lesson_length: 100
          signal_smoothing: true
          threshold: 30.0
        value: 20
      - name: Lesson1
        completion_criteria:
          measure: reward
          behavior: OrcCommander
          min_lesson_length: 100
          signal_smoothing: true
          threshold: 50.0
        value: 25
      - name: Lesson2
        value: 30
